<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - AI Traffic Management System</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #0B1528;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card-404 {
      background: #132238;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .badge-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(0, 186, 99, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00BA63;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 10px;
      color: #FFFFFF;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #00BA63;
      color: #FFFFFF;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14.5px;
      transition: background 0.2s;
    }
    .btn-home:hover {
      background: #009E52;
    }
    .redirect-note {
      font-size: 12.5px;
      color: #64748B;
      margin-top: 18px;
    }
  </style>
  <script>
    setTimeout(function() {
      window.location.href = '/index.html';
    }, 2000);
  </script>
</head>
<body>
  <div class="card-404">
    <div class="badge-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1>Traffic Route Not Found</h1>
    <p>The requested page or traffic view was not found. Redirecting you to the Live Traffic Dashboard...</p>
    <a href="/index.html" class="btn-home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Go to Dashboard
    </a>
    <div class="redirect-note">Redirecting automatically in 2 seconds...</div>
  </div>
</body>
</html>
